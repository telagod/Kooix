name: ci

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM tools (llc) + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang jq ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check JSON contract docs sync (PR)
        if: github.event_name == 'pull_request'
        env:
          KX_DOC_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KX_DOC_SYNC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_sync_dir="/tmp/kx-doc-sync-gate"
          docs_sync_log="$docs_sync_dir/gate.log"
          docs_sync_meta="$docs_sync_dir/meta.txt"
          docs_sync_result="$docs_sync_dir/result.env"

          rm -rf "$docs_sync_dir"
          mkdir -p "$docs_sync_dir"

          {
            echo "base_sha=$KX_DOC_SYNC_BASE_SHA"
            echo "head_sha=$KX_DOC_SYNC_HEAD_SHA"
          } > "$docs_sync_meta"

          set +e
          ./scripts/check_json_contract_docs_sync.sh "$KX_DOC_SYNC_BASE_SHA" "$KX_DOC_SYNC_HEAD_SHA" >"$docs_sync_log" 2>&1
          docs_sync_status=$?
          set -e

          if [[ "$docs_sync_status" -eq 0 ]]; then
            docs_sync_state="pass"
          else
            docs_sync_state="fail"
          fi

          {
            echo "docs_sync_state=$docs_sync_state"
            echo "docs_sync_base=$KX_DOC_SYNC_BASE_SHA"
            echo "docs_sync_head=$KX_DOC_SYNC_HEAD_SHA"
          } > "$docs_sync_result"

          if [[ "$docs_sync_status" -ne 0 ]]; then
            cat "$docs_sync_log" >&2
            exit "$docs_sync_status"
          fi

      - name: Upload docs-sync gate artifact (PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-sync-gate-log
          path: |
            /tmp/kx-doc-sync-gate/meta.txt
            /tmp/kx-doc-sync-gate/result.env
            /tmp/kx-doc-sync-gate/gate.log
          if-no-files-found: warn

      - name: Bootstrap cold-start guard smoke
        run: |
          set -euo pipefail

          out_v013="$(mktemp /tmp/kx-guard-v013-log-XXXXXX)"
          out_heavy="$(mktemp /tmp/kx-guard-heavy-log-XXXXXX)"
          dir_v013="$(mktemp -d /tmp/kx-guard-v013-dist-XXXXXX)"
          dir_heavy="$(mktemp -d /tmp/kx-guard-heavy-dist-XXXXXX)"
          trap 'rm -f "$out_v013" "$out_heavy"; rm -rf "$dir_v013" "$dir_heavy"' EXIT

          if KX_SAFE_COLD_START_GUARD=1 CARGO_BUILD_JOBS=1 ./scripts/bootstrap_v0_13.sh "$dir_v013" >"$out_v013" 2>&1; then
            echo "expected bootstrap_v0_13 cold-start guard to fail fast" >&2
            cat "$out_v013" >&2
            exit 1
          fi
          grep -q "cold-start rebuild blocked" "$out_v013"

          if KX_HEAVY_COLD_START_GUARD=1 CARGO_BUILD_JOBS=1 ./scripts/bootstrap_heavy_gate.sh "$dir_heavy" >"$out_heavy" 2>&1; then
            echo "expected bootstrap_heavy cold-start guard to fail fast" >&2
            cat "$out_heavy" >&2
            exit 1
          fi
          grep -q "cold-start rebuild blocked" "$out_heavy"

          echo "ok: bootstrap cold-start guard smoke passed"

      - name: Test
        # Keep resource usage stable: bootstrap/native tests may spawn external toolchains.
        env:
          KX_DETERMINISM: "1"
          KX_GOLDEN: "1"
        run: cargo test -p kooixc -j 2 -- --test-threads=1

      - name: Module-aware check gate matrix
        run: |
          set -euo pipefail

          cargo run -p kooixc -- check-modules examples/import_alias_main.kooix --json > module-check-pass.json

          cargo run -p kooixc -- check-modules examples/module_check_gate_warn.kooix --json > module-check-warn.json
          if cargo run -p kooixc -- check-modules examples/module_check_gate_warn.kooix --json --strict-warnings > module-check-warn-strict.json; then
            echo "expected strict warning gate to fail" >&2
            exit 1
          fi

          if cargo run -p kooixc -- check-modules examples/module_check_gate_error.kooix --json > module-check-error.json; then
            echo "expected error gate to fail" >&2
            exit 1
          fi

          if cargo run -p kooixc -- check-modules examples/module_check_gate_error.kooix --json --strict-warnings > module-check-error-strict.json; then
            echo "expected strict error gate to fail" >&2
            exit 1
          fi

      - name: Check JSON contract smoke
        run: |
          ./scripts/check_json_contract.sh --assert

      - name: Check JSON schema migration-window smoke
        run: |
          set -euo pipefail

          # migration window: current producer schema_version=1 should pass in [1,2]
          KX_CHECK_JSON_MIN_SCHEMA_VERSION=1 \
          KX_CHECK_JSON_MAX_SCHEMA_VERSION=2 \
          ./scripts/check_json_contract.sh --assert

          # strict v2-only consumer should reject current schema_version=1
          if KX_CHECK_JSON_MIN_SCHEMA_VERSION=2 KX_CHECK_JSON_MAX_SCHEMA_VERSION=2 ./scripts/check_json_contract.sh --assert; then
            echo "expected schema window [2,2] to fail against current producer schema_version=1" >&2
            exit 1
          fi

      - name: Check JSON schema fixture rollback matrix
        run: |
          ./scripts/check_json_schema_fixture_matrix.sh --assert

      - name: Check JSON schema drift triage smoke
        run: |
          set -euo pipefail
          triage_dir="/tmp/kx-schema-drift-triage"
          triage_result_file="$triage_dir/result.env"
          triage_summary_file="$triage_dir/summary.txt"
          triage_stdout_file="$triage_dir/stdout.log"
          triage_stderr_file="$triage_dir/stderr.log"

          rm -rf "$triage_dir"
          mkdir -p "$triage_dir"

          set +e
          KX_CHECK_JSON_TRIAGE_SMOKE_SUMMARY_OUT="$triage_summary_file" \
          ./scripts/check_json_schema_drift_triage_smoke.sh >"$triage_stdout_file" 2>"$triage_stderr_file"
          triage_status=$?
          set -e

          if [[ "$triage_status" -eq 0 ]]; then
            smoke_state="pass"
          else
            smoke_state="fail"
          fi

          {
            echo "triage_smoke_state=$smoke_state"
          } > "$triage_result_file"

          if [[ "$triage_status" -ne 0 ]]; then
            echo "schema drift triage smoke failed (see artifact schema-drift-triage-logs)" >&2
            tail -n 120 "$triage_stderr_file" >&2 || true
            exit "$triage_status"
          fi

      - name: Upload schema drift triage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-triage-logs
          path: |
            /tmp/kx-schema-drift-triage/result.env
            /tmp/kx-schema-drift-triage/summary.txt
            /tmp/kx-schema-drift-triage/stdout.log
            /tmp/kx-schema-drift-triage/stderr.log
          if-no-files-found: warn

      - name: Module-preflight metrics script smoke
        run: |
          set -euo pipefail

          cat > /tmp/module-preflight-enabled.metrics <<'EOF'
          module_preflight_enabled=enabled
          module_preflight_entry=examples/import_variant_main.kooix
          module_preflight_json=module-check-pass.json
          module_preflight_ok=true
          module_preflight_errors=0
          module_preflight_warnings=0
          module_preflight_first_diagnostic=none
          module_preflight_schema_version=1
          module_preflight_phase=check-modules
          EOF
          KX_MODULE_PREFLIGHT_ASSERT_SCHEMA=1 \
          ./scripts/bootstrap_module_preflight_json_check.sh /tmp/module-preflight-enabled.metrics --assert

          cat > /tmp/module-preflight-disabled.metrics <<'EOF'
          module_preflight_enabled=disabled
          module_preflight_entry=examples/import_variant_main.kooix
          module_preflight_json=n/a
          module_preflight_ok=skipped
          module_preflight_errors=n/a
          module_preflight_warnings=n/a
          module_preflight_first_diagnostic=none
          module_preflight_schema_version=n/a
          module_preflight_phase=n/a
          EOF
          ./scripts/bootstrap_module_preflight_json_check.sh /tmp/module-preflight-disabled.metrics --assert

      - name: Bootstrap CI sanity script smoke
        run: |
          ./scripts/bootstrap_ci_sanity_smoke.sh

      - name: Upload module-check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-check-json
          path: |
            module-check-pass.json
            module-check-warn.json
            module-check-warn-strict.json
            module-check-error.json
            module-check-error-strict.json
          if-no-files-found: warn

      - name: Module-check summary
        if: always()
        run: |
          docs_sync_result_file=/tmp/kx-doc-sync-gate/result.env
          docs_sync_log_file=/tmp/kx-doc-sync-gate/gate.log
          triage_result_file=/tmp/kx-schema-drift-triage/result.env
          triage_summary_file=/tmp/kx-schema-drift-triage/summary.txt
          docs_sync_state="n/a"
          docs_sync_base="n/a"
          docs_sync_head="n/a"
          triage_smoke_state="n/a"
          if [[ -f "$docs_sync_result_file" ]]; then
            docs_sync_state="$(awk -F= '$1=="docs_sync_state" {print $2}' "$docs_sync_result_file" | tail -n 1)"
            docs_sync_base="$(awk -F= '$1=="docs_sync_base" {print $2}' "$docs_sync_result_file" | tail -n 1)"
            docs_sync_head="$(awk -F= '$1=="docs_sync_head" {print $2}' "$docs_sync_result_file" | tail -n 1)"
          fi
          if [[ -f "$triage_result_file" ]]; then
            triage_smoke_state="$(awk -F= '$1=="triage_smoke_state" {print $2}' "$triage_result_file" | tail -n 1)"
          fi

          {
            echo "### Check JSON Contract Docs Sync"
            echo ""
            echo "- state: ${docs_sync_state}"
            echo "- schema: n/a"
            echo "- phase: n/a"
            echo "- base: ${docs_sync_base}"
            echo "- head: ${docs_sync_head}"
            if [[ -s "$docs_sync_log_file" ]]; then
              echo "- log:"
              echo '```text'
              cat "$docs_sync_log_file"
              echo '```'
            else
              echo "- log: n/a"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### Schema Drift Triage Smoke"
            echo ""
            echo "- state: ${triage_smoke_state}"
            echo "- schema: n/a"
            echo "- phase: n/a"
            if [[ -s "$triage_summary_file" ]]; then
              echo "- log:"
              echo '```text'
              cat "$triage_summary_file"
              echo '```'
            else
              echo "- log: n/a"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f module-check-pass.json ]; then
            {
              echo "### Module Check Summary"
              echo ""
              echo "- artifact: missing (module-check-*.json not generated)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pass_ok=$(jq -r '.ok' module-check-pass.json)
          warn_ok=$(jq -r '.ok' module-check-warn.json)
          warn_strict_ok=$(jq -r '.ok' module-check-warn-strict.json)
          error_ok=$(jq -r '.ok' module-check-error.json)
          error_strict_ok=$(jq -r '.ok' module-check-error-strict.json)

          count_errors() {
            jq '
              def diag_stream: (.modules[]?.diagnostics[]?), (.errors[]?);
              if (.summary.errors | type) == "number"
              then (.summary.errors | floor)
              else ([diag_stream | select(.severity == "error")] | length)
              end
            ' "$1"
          }

          count_warnings() {
            jq '
              def diag_stream: (.modules[]?.diagnostics[]?), (.errors[]?);
              if (.summary.warnings | type) == "number"
              then (.summary.warnings | floor)
              else ([diag_stream | select(.severity == "warning")] | length)
              end
            ' "$1"
          }

          first_diagnostic() {
            jq -r '
              def diag_stream: (.modules[]?.diagnostics[]?), (.errors[]?);
              ([diag_stream][0].message // "none")
            ' "$1"
          }

          schema_version() {
            jq -r '
              if (.schema_version | type) == "number"
              then (.schema_version | floor | tostring)
              else "n/a"
              end
            ' "$1"
          }

          summary_phase() {
            jq -r '.summary.phase // .phase // "n/a"' "$1"
          }

          pass_errors=$(count_errors module-check-pass.json)
          pass_warnings=$(count_warnings module-check-pass.json)
          pass_schema=$(schema_version module-check-pass.json)
          pass_phase=$(summary_phase module-check-pass.json)

          warn_errors=$(count_errors module-check-warn.json)
          warn_warnings=$(count_warnings module-check-warn.json)
          warn_first=$(first_diagnostic module-check-warn.json)
          warn_schema=$(schema_version module-check-warn.json)
          warn_phase=$(summary_phase module-check-warn.json)
          warn_strict_schema=$(schema_version module-check-warn-strict.json)
          warn_strict_phase=$(summary_phase module-check-warn-strict.json)

          error_errors=$(count_errors module-check-error.json)
          error_warnings=$(count_warnings module-check-error.json)
          error_first=$(first_diagnostic module-check-error.json)
          error_schema=$(schema_version module-check-error.json)
          error_phase=$(summary_phase module-check-error.json)
          error_strict_schema=$(schema_version module-check-error-strict.json)
          error_strict_phase=$(summary_phase module-check-error-strict.json)

          {
            echo "### Module Check Summary"
            echo ""
            echo "#### pass-case"
            echo "- state: ${pass_ok}"
            echo "- schema: ${pass_schema}"
            echo "- phase: ${pass_phase}"
            echo "- log: errors=${pass_errors}, warnings=${pass_warnings}"
            echo ""
            echo "#### warn-case"
            echo "- state: ${warn_ok}"
            echo "- schema: ${warn_schema}"
            echo "- phase: ${warn_phase}"
            echo "- log:"
            echo '```text'
            echo "errors=${warn_errors}, warnings=${warn_warnings}"
            echo "first_diagnostic=${warn_first}"
            echo "strict_state=${warn_strict_ok}"
            echo "strict_schema=${warn_strict_schema}"
            echo "strict_phase=${warn_strict_phase}"
            echo '```'
            echo ""
            echo "#### error-case"
            echo "- state: ${error_ok}"
            echo "- schema: ${error_schema}"
            echo "- phase: ${error_phase}"
            echo "- log:"
            echo '```text'
            echo "errors=${error_errors}, warnings=${error_warnings}"
            echo "first_diagnostic=${error_first}"
            echo "strict_state=${error_strict_ok}"
            echo "strict_schema=${error_strict_schema}"
            echo "strict_phase=${error_strict_phase}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
